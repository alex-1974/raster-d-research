name: M3 Scalar Boundary and Controlled Placement
on:
  push:
    branches: [research/m3-conversion-boundary]
    paths:
      - 'experiments/m3_conversion_boundary/**'
      - 'experiments/m3_conversion_selection/**'
      - '.github/workflows/m3-conversion-boundary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {compiler: dmd-2.111.0, position: native}
          - {compiler: dmd-2.111.0, position: '0'}
          - {compiler: dmd-2.111.0, position: '8'}
          - {compiler: dmd-2.111.0, position: '16'}
          - {compiler: dmd-2.111.0, position: '24'}
          - {compiler: ldc-1.41.0, position: native}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: alex-1974/raster-d
          ref: 7dcdf01babf87e9a80af2864fbad75efe8e7d0ef
          path: raster-d
      - name: Expose sibling layout
        run: ln -s "$GITHUB_WORKSPACE/raster-d" "$GITHUB_WORKSPACE/../raster-d"
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}
          dub: 1.40.0
          dc_format: shortname
      - name: Source and GNU linker setup controls
        run: python3 experiments/m3_conversion_boundary/check_setup.py
      - name: Four consumer/block modes and actual linked boundary
        run: python3 -u experiments/m3_conversion_boundary/collect.py artifacts --compiler "$DC" --positions '${{ matrix.position }}' --processes 1
      - name: Evidence manifest and replay
        run: |
          (cd artifacts && sha256sum -c SHA256SUMS)
          python3 experiments/m3_conversion_boundary/collect.py artifacts --replay > /tmp/boundary-replayed.csv
          cmp /tmp/boundary-replayed.csv artifacts/summary.csv
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: scalar-boundary-${{ matrix.compiler }}-${{ matrix.position }}
          path: artifacts/
          retention-days: 14
