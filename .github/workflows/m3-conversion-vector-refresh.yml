name: M3 Conversion Vector Refresh

on:
  push:
    branches: [research/m3-conversion-vector-refresh]
    paths:
      - 'experiments/m3_conversion_vector_refresh/**'
      - '.github/workflows/m3-conversion-vector-refresh.yml'
  pull_request:
    branches: [research/m3-conversion-ldc-signed-row]
    paths:
      - 'experiments/m3_conversion_vector_refresh/**'
      - '.github/workflows/m3-conversion-vector-refresh.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        compiler: [dmd-2.111.0, ldc-1.41.0]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: alex-1974/raster-d
          ref: 24d948255df014c683d79c5508f13248806062dc
          path: raster-d

      - name: Expose pinned Production sibling
        shell: bash
        run: |
          set -euo pipefail
          ln -s "$GITHUB_WORKSPACE/raster-d" "$GITHUB_WORKSPACE/../raster-d"
          test "$(git -C "$GITHUB_WORKSPACE/raster-d" rev-parse HEAD)" =             "24d948255df014c683d79c5508f13248806062dc"

      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}
          dub: 1.40.0
          dc_format: shortname

      - name: Production unit-test baseline
        shell: bash
        run: |
          set -euo pipefail
          dub test --root="$GITHUB_WORKSPACE/raster-d" --compiler="$DC" --force

      - name: Generate vector refresh
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/m3_conversion_vector_refresh/prepare.py

      - name: Full public semantic controls
        shell: bash
        run: |
          set -euo pipefail
          dub run \
            --root=experiments/m3_conversion_vector_refresh \
            --compiler="$DC" \
            --build=release \
            --force

      - name: Timing smoke
        shell: bash
        run: |
          set -euo pipefail
          BIN=experiments/m3_conversion_vector_refresh/raster-m3-conversion-vector-refresh
          "$BIN" --timing-short 0 > /tmp/timing.txt
          test "$(grep -c '^m3_vector_refresh ' /tmp/timing.txt)" -eq 49
          mkdir -p artifacts
          cp /tmp/timing.txt artifacts/timing.txt
          "$DC" --version > artifacts/compiler.txt
          sha256sum "$BIN" > artifacts/binary.sha256
          git -C "$GITHUB_WORKSPACE/raster-d" rev-parse HEAD > artifacts/production-head.txt

      - name: Retain DMD vector codegen
        if: matrix.compiler == 'dmd-2.111.0'
        shell: bash
        run: |
          set -euo pipefail
          BIN=experiments/m3_conversion_vector_refresh/raster-m3-conversion-vector-refresh
          objdump -dr "$BIN" > artifacts/binary-codegen.txt
          nm -n "$BIN" > artifacts/symbols.txt
          grep -E 'punpck|cvtdq2ps|movdqu|movups' artifacts/binary-codegen.txt             > artifacts/vector-instructions.txt || true
          test -s artifacts/vector-instructions.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vector-refresh-${{ matrix.compiler }}
          path: artifacts/
          retention-days: 14
