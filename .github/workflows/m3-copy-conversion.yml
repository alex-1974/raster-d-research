name: M3 Copy Conversion Baseline
on:
  push:
    branches: [research/m3-copy-conversion-audit]
    paths:
      - 'experiments/m3_copy_conversion/**'
      - 'docs/research/m3-copy-conversion-audit.md'
      - '.github/workflows/m3-copy-conversion.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        compiler: [dmd-2.111.0, ldc-1.41.0]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: alex-1974/raster-d
          ref: 1671fb2e51a7b1e7311f78f575d9457e9f279fd4
          path: raster-d
      - name: Expose sibling layout
        run: ln -s "$GITHUB_WORKSPACE/raster-d" "$GITHUB_WORKSPACE/../raster-d"
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}
          dub: 1.40.0
          dc_format: shortname
      - name: Generate pinned diagnostics and C++ object
        run: |
          python3 experiments/m3_copy_conversion/generate.py
          experiments/m3_copy_conversion/build_cpp.sh
      - name: Semantic and actual-source trust checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          dub test --root=experiments/m3_copy_conversion --compiler="$DC" --force 2>&1 | tee artifacts/tests.txt
          experiments/m3_copy_conversion/trusted_challenge.sh "$DC" 2>&1 | tee artifacts/trust.txt
      - name: Public consumer release diagnostic
        shell: bash
        run: |
          set -euo pipefail
          "$DC" --version > artifacts/environment.txt
          dub --version >> artifacts/environment.txt
          lscpu >> artifacts/environment.txt
          dub run --root=experiments/m3_copy_conversion --compiler="$DC" --build=release --force --vverbose 2>&1 | tee artifacts/release.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: copy-conversion-${{ matrix.compiler }}
          path: artifacts/
          retention-days: 14
