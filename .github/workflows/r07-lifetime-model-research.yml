name: R0.7 Lifetime Models Research
on:
  push:
    branches: [research/borrow-lifetime-model-comparison]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    strategy:
      fail-fast: false
      matrix:
        compiler: [dmd-2.111.0, ldc-1.41.0]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}
          dub: 1.40.0
          dc_format: shortname
      - name: Compile all toy models in ordinary and DIP1000 modes
        run: bash experiments/r0_7_lifetime_models/compile-matrix.sh "$DC"
      - name: Run preliminary retained-read microbenchmark
        shell: bash
        run: |
          set -euo pipefail
          root=experiments/r0_7_lifetime_models
          "$DC" -O -release -I="$root/probes" \
            -of=/tmp/r07-lifetime-bench \
            "$root/benchmark.d" "$root/probes/retained_malloc.d"
          /tmp/r07-lifetime-bench
